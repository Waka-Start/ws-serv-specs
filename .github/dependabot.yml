# Dependency maintenance: grouped compatible updates and security fixes.
version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  labels:
  - dependencies
  groups:
    compatible-updates:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    security-fixes:
      applies-to: security-updates
      patterns:
      - "*"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  target-branch: prod
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - security
  - prod
  groups:
    compatible-updates:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  schedule:
    interval: weekly
  open-pull-requests-limit: 2
  directory: "/"
  groups:
    compatible-updates:
      applies-to: version-updates
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    security-fixes:
      applies-to: security-updates
      patterns:
      - "*"
