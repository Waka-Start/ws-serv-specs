version: 2
updates:
  # Scan main dev branch — non-blocking, weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # Scan prod branch — security-focused, weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "prod"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "prod"
